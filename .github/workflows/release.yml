name: Release

# Production app: tag vX.Y.Z publishes a normal GitHub Release.
# vX.Y.Z-beta.N is rejected. Pull requests keep using build-apk.yml and
# do not need signing secrets.
#
# The tagged commit is not executed until it is an ancestor of the default
# branch. Version parsing uses the script on that branch, then the build
# checks out GITHUB_SHA.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # upload-artifact v4+ finalizes via the actions API.
      actions: write
    steps:
      # Default branch first. Do not run anything from the tagged commit
      # until that commit is known to be on this branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Require the tag commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::This app publishes a normal release from tag vX.Y.Z only (got '${tag}'). vX.Y.Z-beta.N is not used here."
            exit 1
          fi
          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Could not determine the default branch."
            exit 1
          fi
          if [[ -z "${GITHUB_TOKEN}" ]]; then
            echo "::error::GITHUB_TOKEN is empty; cannot fetch ${DEFAULT_BRANCH}."
            exit 1
          fi
          # persist-credentials is false, so this fetch authenticates itself
          # and does not write the header into git config.
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${basic}" \
            fetch --no-tags origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
            "refs/tags/${tag}:refs/tags/${tag}"
          unset basic
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::Tag ${tag} (${GITHUB_SHA}) is not on origin/${DEFAULT_BRANCH}."
            exit 1
          fi

      - name: Resolve version from the default branch
        run: |
          set -euo pipefail
          # This checkout is the default branch, not the tagged commit.
          bash scripts/release-version.sh --self-test
          tag="${GITHUB_REF#refs/tags/}"
          version_line="$(bash scripts/release-version.sh "$tag")"
          read -r version_name version_code <<<"$version_line"
          if [[ -z "${version_name}" || -z "${version_code}" ]]; then
            echo "::error::Version calculation produced no output for ${tag}."
            exit 1
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "versionName=${version_name} versionCode=${version_code}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # v3 still installs the removed SDK "tools" package and fails with
      # "Failed to find package 'tools'". v4 installs cmdline-tools only.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      # Secrets are step-level and only here. A missing one fails before Gradle.
      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${ANDROID_KEYSTORE_BASE64}" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "${ANDROID_KEYSTORE_PASSWORD}" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "${ANDROID_KEY_ALIAS}" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "${ANDROID_KEY_PASSWORD}" ]] && missing+=("ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing release signing secrets: ${missing[*]}. Refusing to build an unsigned or debug-signed APK."
            exit 1
          fi
          keystore="${RUNNER_TEMP}/health-daily-release.keystore"
          case "$keystore" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*)
              echo "::error::Refusing to write the keystore inside the workspace."
              exit 1
              ;;
          esac
          cleanup() { rm -f "$keystore"; }
          trap cleanup EXIT
          umask 077
          rm -f "$keystore"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [[ ! -s "$keystore" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$keystore"
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Package release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}."
            ls -la app/build/outputs/apk/release >&2 || true
            exit 1
          fi
          apk_name="health-daily-${RELEASE_TAG}.apk"
          assets="app/build/release-assets"
          rm -rf "$assets"
          mkdir -p "$assets"
          cp "${apks[0]}" "${assets}/${apk_name}"
          (
            cd "$assets"
            sha256sum "$apk_name" > "${apk_name}.sha256"
          )
          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          aapt="${build_tools}/aapt"
          apksigner="${build_tools}/apksigner"
          badging="$("$aapt" dump badging "${assets}/${apk_name}")"
          printf '%s\n' "$badging" | head -n 5
          grep -F "versionCode='${VERSION_CODE}'" <<<"$badging" >/dev/null
          grep -F "versionName='${VERSION_NAME}'" <<<"$badging" >/dev/null
          certs="$("$apksigner" verify --print-certs "${assets}/${apk_name}")"
          printf '%s\n' "$certs"
          if printf '%s\n' "$certs" | grep -qi 'CN=Android Debug'; then
            echo "::error::Release APK is signed with the Android debug certificate."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-daily-release
          path: app/build/release-assets/*
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/health-daily-release.keystore"

  release:
    needs: build
    if: success() && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: health-daily-release
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Refusing to publish tag '${tag}'."
            exit 1
          fi
          apk="health-daily-${tag}.apk"
          sum="${apk}.sha256"
          cd release-assets
          [[ -f "$apk" && -f "$sum" ]]
          file_count="$(find . -type f | wc -l)"
          if [[ "$file_count" -ne 2 ]]; then
            echo "::error::Expected exactly two release assets, found ${file_count}."
            find . -type f >&2
            exit 1
          fi
          sha256sum -c "$sum"
          resolved="$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)"
          if [[ "$resolved" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${tag} points at ${resolved}, not ${GITHUB_SHA}."
            exit 1
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            --target "$GITHUB_SHA" \
            "$apk" \
            "$sum"
