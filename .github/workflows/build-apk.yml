name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v3 still installs the removed SDK "tools" package and fails with
      # "Failed to find package 'tools'". v4 installs cmdline-tools only.
      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: health-daily-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
